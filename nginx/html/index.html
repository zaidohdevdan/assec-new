<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assecce — Em Breve</title>
  <meta name="description" content="Estamos construindo algo incrível. Em breve o Assecce estará disponível para você." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6C63FF;
      --accent2: #48CFAD;
      --bg: #0A0A14;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #F0F0FF;
      --muted: rgba(240,240,255,0.45);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* Fundo animado */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(108,99,255,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(72,207,173,0.12) 0%, transparent 55%),
        var(--bg);
    }

    .grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
      animation: drift 12s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: rgba(108,99,255,0.15); top: -150px; left: -150px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: rgba(72,207,173,0.10); bottom: -100px; right: -100px; animation-delay: -6s; }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 40px) scale(0.97); }
    }

    /* Container */
    .container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      gap: 2.5rem;
    }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.75rem; font-weight: 500;
      color: var(--accent2);
      letter-spacing: 0.08em; text-transform: uppercase;
      backdrop-filter: blur(10px);
      animation: fadeUp 0.6s ease both;
    }
    .badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Logo / título */
    .logo {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .subtitle {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--muted);
      font-weight: 400;
      text-align: center;
      max-width: 480px;
      line-height: 1.65;
      animation: fadeUp 0.6s ease 0.2s both;
    }

    /* Contador */
    .countdown {
      display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    .countdown-block {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.2rem 1.8rem;
      backdrop-filter: blur(12px);
      min-width: 90px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .countdown-block:hover {
      transform: translateY(-4px);
      border-color: rgba(108,99,255,0.4);
    }

    .countdown-num {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .countdown-label {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Divider */
    .divider {
      width: 100%; max-width: 420px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      animation: fadeUp 0.6s ease 0.4s both;
    }

    /* Email */
    .email-form {
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      width: 100%; max-width: 400px;
      animation: fadeUp 0.6s ease 0.5s both;
    }
    .email-label {
      font-size: 0.8rem; color: var(--muted); font-weight: 400;
    }
    .email-row {
      display: flex; width: 100%; gap: 8px;
    }
    .email-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s ease;
      backdrop-filter: blur(10px);
    }
    .email-input::placeholder { color: var(--muted); }
    .email-input:focus { border-color: rgba(108,99,255,0.6); }

    .btn {
      background: linear-gradient(135deg, var(--accent), #8B5CF6);
      border: none; border-radius: 12px;
      padding: 12px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(108,99,255,0.3);
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.45); }
    .btn:active { transform: translateY(0); }

    .success-msg {
      display: none;
      font-size: 0.85rem;
      color: var(--accent2);
      font-weight: 500;
    }

    /* Footer */
    .footer {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      font-size: 0.75rem; color: var(--muted);
      white-space: nowrap;
      animation: fadeUp 0.6s ease 0.6s both;
    }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .countdown-block { padding: 1rem 1.2rem; min-width: 72px; }
      .email-row { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <div class="badge">
      <div class="badge-dot"></div>
      Em desenvolvimento
    </div>

    <div class="logo">Assecce</div>

    <p class="subtitle">
      Estamos construindo algo incrível.<br />
      Em breve estaremos no ar — com tudo que você precisa.
    </p>

    <div class="countdown" id="countdown">
      <div class="countdown-block">
        <span class="countdown-num" id="days">00</span>
        <span class="countdown-label">Dias</span>
      </div>
      <div class="countdown-block">
        <span class="countdown-num" id="hours">00</span>
        <span class="countdown-label">Horas</span>
      </div>
      <div class="countdown-block">
        <span class="countdown-num" id="minutes">00</span>
        <span class="countdown-label">Min</span>
      </div>
      <div class="countdown-block">
        <span class="countdown-num" id="seconds">00</span>
        <span class="countdown-label">Seg</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="email-form">
      <span class="email-label">Seja o primeiro a saber quando lançarmos</span>
      <div class="email-row">
        <input id="email-input" class="email-input" type="email" placeholder="seu@email.com" />
        <button class="btn" onclick="handleNotify()">Notificar</button>
      </div>
      <span class="success-msg" id="success-msg">✓ Ótimo! Te avisaremos quando estivermos no ar.</span>
    </div>
  </div>

  <div class="footer">
    &copy; 2025 Assecce &nbsp;·&nbsp; <a href="mailto:contato@assecce.com.br">contato@assecce.com.br</a>
  </div>

  <script>
    // Countdown — 30 dias a partir de hoje
    const launch = new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const diff = launch - Date.now();
      if (diff <= 0) { document.getElementById('countdown').style.display = 'none'; return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      document.getElementById('days').textContent    = pad(d);
      document.getElementById('hours').textContent   = pad(h);
      document.getElementById('minutes').textContent = pad(m);
      document.getElementById('seconds').textContent = pad(s);
    }

    tick();
    setInterval(tick, 1000);

    function handleNotify() {
      const email = document.getElementById('email-input').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('email-input').focus();
        return;
      }
      document.getElementById('success-msg').style.display = 'block';
      document.getElementById('email-input').value = '';
      document.querySelector('.btn').disabled = true;
    }
  </script>
</body>
</html>
