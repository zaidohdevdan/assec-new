user nginx;
worker_processes 1; # 1 vCPU = 1 worker
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    client_max_body_size 5M;
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5; # Equilíbrio CPU/Compressão
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:5m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:5m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=pdf_limit:5m rate=2r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:5m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/*.conf;
}