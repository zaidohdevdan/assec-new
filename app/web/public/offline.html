<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão - ASSEC Ceará</title>
  <style>
    :root {
      --color-primary: #071A2D;
      --color-accent: #D4AF37;
      --color-text: #F8FAFC;
      --color-text-secondary: #94A3B8;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--color-primary);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 480px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }
    
    .logo {
      width: 100px;
      height: auto;
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FFFFFF;
      letter-spacing: 0.5px;
    }
    
    p {
      font-size: 15px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 28px;
    }
    
    .btn-retry {
      display: inline-block;
      background-color: var(--color-accent);
      color: var(--color-primary);
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      margin-bottom: 24px;
    }
    
    .btn-retry:hover {
      background-color: #F0C75E;
      transform: translateY(-1px);
    }
    
    .info-box {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
      text-align: left;
    }
    
    .info-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .info-item {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
    
    .icon {
      margin-right: 8px;
      color: var(--color-accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/pwa-icon-192.png" alt="ASSEC Ceará Logo" class="logo">
    <h1>Sem Conexão com a Internet</h1>
    <p>O portal da ASSEC não pôde ser carregado porque você está desconectado. Verifique sua conexão e tente novamente.</p>
    
    <button class="btn-retry" onclick="window.location.reload()">Tentar Novamente</button>
    
    <div class="info-box">
      <div class="info-title">Contatos de Emergência</div>
      <div class="info-item">
        <span class="icon">📞</span>
        <span>(85) 99941-1411 (WhatsApp)</span>
      </div>
      <div class="info-item">
        <span class="icon">📍</span>
        <span>Av. Santos Dumont, 1510, Sala 805, Aldeota, Fortaleza - CE</span>
      </div>
    </div>
  </div>
</body>
</html>
