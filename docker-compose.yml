version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: assec-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: '512M'
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assec-backend-prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: https://assecce.com.br
      NODE_OPTIONS: --max-old-space-size=600
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - web-net
    deploy:
      resources:
        limits: { memory: 768M, cpus: '0.3' }
        reservations: { memory: 384M }
    logging:
      driver: "json-file"
      options: { max-size: "3m", max-file: "2" }
    restart: unless-stopped

  frontend:
    build:
      context: ./app/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
    container_name: assec-frontend-prod
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=600
    networks:
      - web-net
    deploy:
      resources:
        limits: { memory: 768M, cpus: '0.2' }
        reservations: { memory: 384M }
    logging:
      driver: "json-file"
      options: { max-size: "3m", max-file: "2" }
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: assec-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - web-net
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.1' }
        reservations: { memory: 64M }
    logging:
      driver: "json-file"
      options: { max-size: "3m", max-file: "2" }
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: assec-certbot-prod
    volumes:
      - ./nginx/ssl:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done'"
    networks:
      - web-net
    deploy:
      resources:
        limits: { memory: 64M, cpus: '0.05' }
    restart: unless-stopped

volumes:
  postgres_prod_data:
  certbot_www:

networks:
  db-net:
    driver: bridge
    internal: true
  web-net:
    driver: bridge
