# ============================================
# PostgreSQL - Otimizado para VPS 4GB RAM / 50GB NVMe
# Container com limite de 1GB de RAM
# ============================================

# ============================================
# CONEXÕES
# ============================================
max_connections = 80
superuser_reserved_connections = 3

# ============================================
# MEMÓRIA (✅ CORREÇÃO: valores realistas para 1GB de container)
# ============================================
# shared_buffers = 25% da RAM do container (1GB)
shared_buffers = 256MB

# effective_cache_size = total disponível para cache do SO + Postgres
effective_cache_size = 768MB

# work_mem = memória por operação de ordenação/hash
# 4MB * 80 conexões = 320MB no pior caso (dentro do limite)
work_mem = 4MB

# memória para operações de manutenção (VACUUM, CREATE INDEX)
maintenance_work_mem = 64MB

# ============================================
# CHECKPOINT & WAL (✅ CORREÇÃO: reduzido para economizar disco)
# ============================================
checkpoint_completion_target = 0.9
wal_buffers = 8MB
min_wal_size = 256MB
max_wal_size = 512MB

# ============================================
# PERFORMANCE NVMe
# ============================================
random_page_cost = 1.1
effective_io_concurrency = 200

# ============================================
# WORKERS PARALELOS (1 vCPU)
# ============================================
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# ============================================
# LOGGING (mínimo para economizar disco)
# ============================================
log_min_duration_statement = 2000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ============================================
# AUTOVACUUM (conservador para 1 CPU)
# ============================================
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 5min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50