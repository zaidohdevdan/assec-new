services:
  nginx:
    image: nginx:alpine
    container_name: assec-nginx-coming-soon
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/coming-soon.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - assec-net

  certbot:
    image: certbot/certbot:latest
    container_name: assec-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Rode manualmente: docker compose -f docker-compose.coming-soon.yml run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  letsencrypt:
    driver: local
  certbot-www:
    driver: local

networks:
  assec-net:
    driver: bridge
